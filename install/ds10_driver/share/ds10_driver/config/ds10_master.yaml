# DS10 driver — master role example parameters.
# Load with:  ros2 run ds10_driver ds10_node --ros-args --params-file <this>
/**:
  ros__parameters:
    port: /dev/ttyUSB0
    baud: 115200
    role: master
    # station_id ignored in master role (target comes from each tx Frame).
    frame_timeout_ms: 20      # burst-end silence threshold (ticket 02 calibrated)
    max_frame_bytes: 4095     # single-frame cap; tx rejects larger (ticket 04)
    tx_topic: "~/tx"
    rx_topic: "~/rx"
